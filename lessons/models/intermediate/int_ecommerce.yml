version: 2

models:
  - name: int_ecommerce__order_items_products
    description: "Intermediate model for order items"
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item"
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Identifier for the order associated with this item"
        tests:
          - not_null
          # Test if a foreign key, order_id exists in the orders table
          - relationships:
              to: ref('stg_ecommerce__orders')
              field: order_id

      - name: user_id
        description: "Identifier for the user who placed the order"
        tests:
          - not_null

      - name: product_id
        description: "Identifier for the product in this order item"
        tests:
          - not_null
          # Test if a foreign key, product_id exists in the products table
          - relationships:
              to: ref('stg_ecommerce__products')
              field: product_id

      - name: item_sale_price
        description: "Sale price of the product at the time of purchase"
        tests:
          - not_null
      
      - name: product_department
        description: "Whether the item is Menswear or Womenswear"
        tests:
          - not_null

      - name: product_cost
        description: "How much the product cost the business to purchase"
        tests:
          - not_null

      - name: product_retail_price
        description: "How much the product retails for on the online store"
        tests:
          - not_null

      - name: item_profit
        description: "item_sale_price minus product_cost"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (item_sale_price - product_cost)"

      - name: item_discount
        description: "product_retail_price minus item_sale_price"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (product_retail_price - item_sale_price)"
              

  
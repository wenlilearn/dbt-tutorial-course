models:
  - name: stg_ecommerce__order_items
    description: ""
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          # Test if a foreign key, order_id exists in the orders table
          - relationships:
              to: ref('stg_ecommerce__orders')
              field: order_id

      - name: user_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          # Test if a foreign key, product_id exists in the products table
          - relationships:
              to: ref('stg_ecommerce__products')
              field: product_id

      - name: sale_price
        tests:
          - not_null
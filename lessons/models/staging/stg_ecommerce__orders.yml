models:
  - name: stg_ecommerce__orders
    description: |
      Table of 1 row per order.
      This table contains the order_id, user_id, status, created_at, returned_at, shipped_at, delivered_at, and num_of_item.
    columns:
      - name: order_id
        description: ""
        tests:
          - not_null
          - unique

      - name: user_id
        description: ""

      - name: status
        description: ""
        tests:
          - accepted_values:
              description: "Check that the order status is one of the accepted values."
              values:
                - Processing
                - Cancelled
                - Shipped
                - Complete
                - Returned

      - name: created_at
        description: ""

      - name: returned_at
        description: ""

      - name: shipped_at
        description: ""

      - name: delivered_at
        description: ""

      - name: num_of_item
        description: ""
models:
  - name: stg_ecommerce__orders
    description: |
      Table of 1 row per order.
      This table contains the order_id, user_id, status, created_at, returned_at, shipped_at, delivered_at, and num_of_item.
    columns:
      - name: order_id
        description: ""
        tests:
          - not_null
          - unique

      - name: user_id
        description: ""

      - name: status
        description: ""
        tests:
          - accepted_values:
              description: "Check that the order status is one of the accepted values."
              values:
                - Processing
                - Cancelled
                - Shipped
                - Complete
                - Returned

      - name: created_at
        description: "when the order was created"
        tests:
          - not_null

      - name: returned_at
        description: "when the order was returned"
        tests:
          - not_null:
              where: "status = 'Returned'"
          
      - name: shipped_at
        description: "when the order was shipped"
        tests:
          - not_null:
              where: "delivered_at is not null or status = 'Shipped'"

      - name: delivered_at
        description: "when the order was delivered"
        tests:
          - not_null:
              where: "returned_at is not null or status = 'Complete'"

      - name: num_of_item
        description: "Number of items in the order"
        tests:
          - not_null
